<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="wall1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
  </defs>
  <!-- Room Wall -->
  <rect width="600" height="400" fill="url(#wall1)"/>
  <!-- Floor -->
  <polygon points="0,290 600,290 600,400 0,400" fill="#2E1C0C"/>
  <line x1="0" y1="290" x2="600" y2="290" stroke="#452A12" stroke-width="2"/>
  <!-- Panoramic Balcony Window -->
  <rect x="360" y="50" width="200" height="230" rx="4" fill="#0B192C" stroke="#D4AF37" stroke-width="3"/>
  <rect x="370" y="60" width="180" height="210" fill="#142D4C"/>
  <circle cx="480" cy="110" r="18" fill="#FFE082" opacity="0.8"/>
  <polygon points="370,170 550,170 550,270 370,270" fill="#0E233D"/>
  <line x1="460" y1="60" x2="460" y2="270" stroke="#D4AF37" stroke-width="2"/>
  <!-- King Bed Headboard -->
  <rect x="60" y="140" width="260" height="150" rx="8" fill="#1E3E62" stroke="#D4AF37" stroke-width="3"/>
  <!-- Bed Mattress & Sheets -->
  <rect x="70" y="210" width="240" height="90" rx="6" fill="#F8FAFC"/>
  <!-- Gold Bed Throw -->
  <rect x="70" y="270" width="240" height="30" fill="url(#goldAccent)"/>
  <!-- Pillows -->
  <rect x="90" y="175" width="85" height="40" rx="4" fill="#FFFFFF" stroke="#E2E8F0"/>
  <rect x="205" y="175" width="85" height="40" rx="4" fill="#FFFFFF" stroke="#E2E8F0"/>
  <!-- Nightstands & Lamps -->
  <rect x="20" y="230" width="40" height="60" rx="3" fill="#1A202C"/>
  <polygon points="30,195 50,195 55,215 25,215" fill="#D4AF37"/>
  <line x1="40" y1="215" x2="40" y2="230" stroke="#D4AF37" stroke-width="2"/>
  <!-- Chandelier Warm Glow -->
  <circle cx="200" cy="40" r="12" fill="#D4AF37"/>
  <line x1="200" y1="0" x2="200" y2="40" stroke="#D4AF37" stroke-width="2"/>
</svg>

